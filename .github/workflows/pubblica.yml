
name: Aggiorna calendari UniSR

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 0,6,12,18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: python -m pip install requests beautifulsoup4

      - name: Verifica orario dal portale UniSR
        run: python orario.py --output raw.ics

      - name: Genera calendari per materia
        run: python build.py --input raw.ics --output public

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica calendari
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Pubblica sito
        id: deployment
        uses: actions/deploy-pages@v4
