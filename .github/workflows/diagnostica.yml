name: Diagnostica elettivo UniSR
on:
  push:
    paths:
      - 'probe_portale.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Verifica filtri e nome elettivo
        run: python probe_portale.py
